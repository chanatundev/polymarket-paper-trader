<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket · paper portfolio</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("/brand/inter.ttf") format("truetype");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #ffffff; --fg: #000000; --muted: rgb(0 0 0 / 62%); --line: rgb(0 0 0 / 14%);
    --panel: #ffffff; --soft: #f5f7fa; --blue: #2e5cff; --logo-filter: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --fg: #ffffff; --muted: rgb(255 255 255 / 68%);
      --line: rgb(255 255 255 / 16%); --panel: #080808; --soft: #111111;
      --logo-filter: invert(1);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --fg: #ffffff; --muted: rgb(255 255 255 / 68%);
    --line: rgb(255 255 255 / 16%); --panel: #080808; --soft: #111111;
    --logo-filter: invert(1);
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-optical-sizing: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px; }
  .masthead { display: flex; align-items: center; gap: 14px; margin: 6px 0 14px; }
  .brand-logo { display: block; width: 112px; height: auto; filter: var(--logo-filter); }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; }
  h2 { font-size: 18px; line-height: 1.3; margin: 0; }
  .banner { background: var(--blue); color: white; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 18px; margin-top: 16px; }
  .section-heading { margin: 0 0 12px; }
  .meta, .secondary-summary { color: var(--muted); font-size: 14px; }
  .status { min-height: 1.5em; margin: 8px 0 0; }
  .empty, .chart-empty { color: var(--muted); padding: 24px 8px; text-align: center; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .metric { display: grid; align-content: start; gap: 4px; min-width: 0;
    padding: 14px; background: var(--soft); border-radius: 7px; }
  .metric strong { font-size: 21px; line-height: 1.25; font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere; }
  .secondary-summary { margin: 14px 0 0; }
  .secondary-summary strong { color: var(--fg); font-variant-numeric: tabular-nums; }
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  figure { min-width: 0; margin: 0; padding: 14px; background: var(--soft); border-radius: 7px; }
  figcaption { display: grid; gap: 2px; margin-bottom: 8px; }
  figcaption strong { font-size: 16px; }
  figcaption span { color: var(--muted); font-size: 13px; }
  .chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-grid { stroke: var(--line); stroke-width: 1; }
  .chart-axis { fill: var(--muted); font: 15px "Inter", system-ui, sans-serif; }
  .chart-label, .chart-value { fill: var(--fg); font: 16px "Inter", system-ui, sans-serif; }
  .chart-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cash-line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round;
    stroke-linejoin: round; }
  .chart-dot { fill: var(--blue); stroke: var(--panel); stroke-width: 2; }
  .pnl-bar { fill: var(--blue); }
  .position-list { list-style: none; margin: 0; padding: 0; }
  .position-row { display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 14px 0; border-bottom: 1px solid var(--line); }
  .position-row:first-child { padding-top: 2px; }
  .position-row:last-child { border-bottom: 0; padding-bottom: 2px; }
  .position-row > div { display: grid; gap: 3px; min-width: 0; }
  .position-row > div > strong { overflow-wrap: anywhere; }
  .position-quantity { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .outcome { color: var(--blue); }
  .technical { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .technical summary { cursor: pointer; width: fit-content; }
  .technical code { display: block; margin-top: 4px; overflow-wrap: anywhere; }
  .technical-id { display: block; margin-top: 4px; overflow-wrap: anywhere; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 11px 8px; border-bottom: 1px solid var(--line);
    text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase;
    white-space: nowrap; }
  th:first-child, td:first-child { width: 155px; }
  th:nth-child(2), td:nth-child(2) { width: 260px; }
  th:last-child, td:last-child { width: 110px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td time, .activity-row time { white-space: nowrap; }
  .trade-side { color: var(--blue); }
  .activity-panel > summary { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; cursor: pointer; list-style-position: inside; }
  .activity-panel > summary span:first-of-type { font-size: 18px; font-weight: 650; }
  .activity-count { color: var(--muted); font-size: 14px; font-weight: 400; }
  .activity-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .activity-row { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto;
    align-items: start; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .activity-row > div { display: grid; min-width: 0; gap: 2px; }
  .activity-row > div strong { overflow-wrap: anywhere; }
  .event-kind { color: var(--muted); font-size: 13px; white-space: nowrap; }
  button { border: 0; border-radius: 6px; background: var(--blue); color: white;
    font: inherit; font-size: 14px; padding: 9px 13px; cursor: pointer; }
  button:disabled { opacity: .65; cursor: wait; }
  @media (max-width: 760px) {
    main { padding: 12px; }
    .metrics, .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .activity-row { grid-template-columns: 1fr auto; gap: 4px 12px; }
    .activity-row time { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
  }
  @media (max-width: 520px) {
    .masthead { align-items: flex-start; flex-direction: column; }
    .metrics, .charts { grid-template-columns: 1fr; }
    .panel { padding: 14px; }
    .position-row { align-items: flex-start; flex-direction: column; gap: 6px; }
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2),
    th:last-child, td:last-child { width: auto; }
    tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
    td { border: 0; padding: 3px 0; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
    td.num { text-align: left; }
  }
</style>
<script src="/live.js" defer></script>
</head>
<body>
<main>
  <header class="masthead">
    <img class="brand-logo" src="/brand/polymarket.svg" alt="Polymarket">
    <h1>Paper portfolio</h1>
  </header>
  <div class="banner" role="note">
    <strong>PAPER ONLY · READ ONLY.</strong>
    All values are model output. No live orders or real funds are used.
  </div>
  <p id="live-status" class="meta status" role="status" aria-live="polite"></p>

  <section class="panel" aria-labelledby="account-heading">
    <h2 id="account-heading" class="section-heading">Portfolio summary</h2>
    <div id="account-content"><!--ACCOUNT--></div>
  </section>

  <section class="panel" aria-labelledby="charts-heading">
    <h2 id="charts-heading" class="section-heading">Latest run at a glance</h2>
    <div class="charts">
      <figure>
        <figcaption><strong>Cash balance</strong><span>After each cash change in this run</span></figcaption>
        <div id="cash-chart"><!--CASH_CHART--></div>
      </figure>
      <figure>
        <figcaption><strong>Trade results</strong><span>Closed trades and open-position estimate</span></figcaption>
        <div id="pnl-chart"><!--PNL_CHART--></div>
      </figure>
    </div>
  </section>

  <section class="panel" aria-labelledby="positions-heading">
    <h2 id="positions-heading" class="section-heading">Open positions</h2>
    <div id="positions-content"><!--POSITIONS--></div>
  </section>

  <section class="panel" aria-labelledby="transactions-heading">
    <h2 id="transactions-heading" class="section-heading">Recent trades</h2>
    <p id="transactions-meta" class="meta"><!--TRANSACTION_META--></p>
    <table>
      <thead><tr><th>Time</th><th>Trade</th><th>Market</th><th class="num">Fee</th></tr></thead>
      <tbody id="transactions-recent"><!--TRANSACTIONS--></tbody>
      <tbody id="transactions-older"></tbody>
    </table>
    <div id="transaction-more"><!--TRANSACTION_MORE--></div>
  </section>

  <details class="panel activity-panel">
    <summary><span>Technical activity log</span><span id="activity-count" class="activity-count"><!--ACTIVITY_COUNT--></span></summary>
    <p id="activity-meta" class="meta"><!--ACTIVITY_META--></p>
    <ol id="activity-content" class="activity-list"><!--ACTIVITY--></ol>
  </details>
</main>
</body>
</html>
