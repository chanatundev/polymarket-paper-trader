[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-paper-trader"
version = "0.2.0"
description = "Versioned, paper-only Polymarket research and replay workbench."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chanatun Kohsuwan"}]
keywords = ["polymarket", "paper-trading", "prediction-markets", "replay", "mcp"]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pm-trader = "pm_trader.cli:main"
pm-trader-mcp = "pm_trader.mcp_server:main"

[tool.setuptools.packages.find]
include = ["pm_trader*"]

[tool.setuptools.package-data]
pm_trader = ["gui_assets/*.html", "gui_assets/*.css", "gui_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
